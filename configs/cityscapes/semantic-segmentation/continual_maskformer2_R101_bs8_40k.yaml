_BASE_: maskformer2_R50_bs8_40k.yaml
MODEL:
  WEIGHTS: detectron2://ImageNetPretrained/MSRA/R-101.pkl
  RESNETS:
    DEPTH: 101
    STEM_TYPE: basic
    STEM_OUT_CHANNELS: 64
    STRIDE_IN_1X1: false
    OUT_FEATURES:
    - res2
    - res3
    - res4
    - res5
    NORM: BN
    RES5_MULTI_GRID:
    - 1
    - 1
    - 1
INPUT:
  DATASET_MAPPER_NAME: continual_semantic
DATASETS:
  TRAIN: ("current_cityscapes_sem_seg_train",)
  TEST: ("current_cityscapes_sem_seg_val",)
SOLVER:
  IMS_PER_BATCH: 8
  BASE_LR: 0.0001
  CHECKPOINT_PERIOD: 2500
CONT:
  SETTING: overlapped
  MED_TOKENS_WEIGHT: 3.0
  MEMORY: false
  RANK: 16
  IMPORTANCE_GRAD_ROUTING: true
  IMPORTANCE_GRAD_MIN: 0.1
  SEMANTIC_PIXEL_CROSS_ATTENTION: true
  DETACH_PIXEL_FEATURES: true
TEST:
  EVAL_PERIOD: 2500
